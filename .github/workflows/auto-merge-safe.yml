name: Safe Auto-Merge

on:
  workflow_run:
    workflows: [PR Safety Gate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for approved PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json isDraft,reviewDecision,labels)"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          review_decision="$(jq -r '.reviewDecision' <<<"$pr_json")"

          if [[ "$is_draft" == "true" || "$review_decision" != "APPROVED" ]]; then
            echo 'Auto-merge not enabled: PR must be non-draft and approved.'
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash

